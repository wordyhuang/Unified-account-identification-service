[uwsgi]
# 项目配置
chdir = /www/wwwroot/unified_auth
module = config.wsgi:application
home = /www/wwwroot/unified_auth/venv

# 网络配置
socket = /www/wwwroot/unified_auth/uwsgi.sock
chmod-socket = 666
# 如果需要直接通过 HTTP 访问（调试用），取消注释下面一行，注释上面两行
# http = 0.0.0.0:8000

# 进程配置
master = true
processes = 4
threads = 2
max-requests = 1000
max-requests-delta = 30

# 日志配置
daemonize = /www/wwwroot/unified_auth/logs/uwsgi.log
pidfile = /www/wwwroot/unified_auth/uwsgi.pid

# 其他配置
vacuum = true
buffer-size = 65536
harakiri = 60
harakiri-verbose = true

# 优雅重启相关
touch-reload = /www/wwwroot/unified_auth/uwsgi.ini