{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号邀请注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(160deg, #eef2ff 0%, #e0e7ff 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
        }
        .card {
            background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.08);
            width: 100%; max-width: 420px; padding: 32px 28px;
        }
        .logo { text-align: center; margin-bottom: 20px; }
        .logo .icon { font-size: 40px; }
        .logo .brand-logo { max-width: 180px; max-height: 56px; display: none; }
        .logo h1 { font-size: 20px; color: #1f2937; margin-top: 8px; }
        .meta { text-align: center; color: #6b7280; font-size: 13px; margin-bottom: 20px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 13px; color: #374151; margin-bottom: 6px; }
        .field label .req { color: #ef4444; margin-left: 2px; }
        .field input, .field select, .field textarea {
            width: 100%; border: 1px solid #d1d5db; border-radius: 8px; padding: 10px 12px;
            font-size: 15px; outline: none; transition: border-color .15s; background: #fff;
        }
        .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand-color, #6366f1); }
        .agreement { display: flex; align-items: flex-start; gap: 8px; margin: 4px 0 12px; font-size: 13px; color: #4b5563; }
        .agreement input { margin-top: 3px; }
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--brand-color, #4f46e5);
            color: #fff; font-size: 16px; cursor: pointer; margin-top: 8px;
        }
        .btn:disabled { opacity: .55; cursor: not-allowed; }
        .msg { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
        .msg.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; display: block; }
        .result { text-align: center; display: none; }
        .result .ok { font-size: 48px; }
        .result h2 { font-size: 18px; color: #065f46; margin: 12px 0 8px; }
        .result p { color: #6b7280; font-size: 14px; }
        .footer { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 14px; display: none; }
    </style>
</head>
<body>
<div class="card">
    <div id="formView">
        <div class="logo">
            <img id="brandLogo" class="brand-logo" alt="">
            <div class="icon" id="defaultIcon">✉️</div>
            <h1 id="brandTitle">账号邀请注册</h1>
        </div>
        <div class="meta" id="inviteMeta">正在获取邀请信息…</div>
        <div class="msg" id="error"></div>
        <form id="regForm" style="display:none" onsubmit="return submitRegister(event)">
            <div id="dynamicFields"></div>
            <div id="agreementBox"></div>
            <button type="submit" class="btn" id="submitBtn">注册账号</button>
        </form>
    </div>
    <div class="result" id="resultView">
        <div class="ok">✅</div>
        <h2>注册成功</h2>
        <p id="resultText"></p>
    </div>
    <div class="footer" id="pageFooter"></div>
</div>
<script>
const CODE = "{{ code|escapejs }}";
const API = "/api/v1/public/invite/" + CODE;
let info = null;
let extras = [];      // [{ field, el }]：除 username/password 外的字段
let agreementEl = null;

function showError(text) {
    const el = document.getElementById("error");
    el.textContent = text; el.className = "msg error";
}
function clearError() {
    document.getElementById("error").className = "msg";
}
function renderMeta() {
    const parts = [];
    if (info.brand && info.brand.welcome) parts.push(info.brand.welcome);
    if (info.require_phone) parts.push("需验证邀请白名单手机号");
    if (info.expires_at) parts.push("有效期至 " + info.expires_at.replace("T", " "));
    if (info.remaining_uses !== null) parts.push("剩余名额 " + info.remaining_uses);
    document.getElementById("inviteMeta").textContent = parts.join(" · ") || "欢迎加入";
}
function applyBrand(brand) {
    if (!brand) return;
    if (brand.name) {
        document.getElementById("brandTitle").textContent = brand.name;
        document.title = brand.name;
    }
    if (brand.theme_color) {
        document.documentElement.style.setProperty("--brand-color", brand.theme_color);
    }
    if (brand.logo) {
        const img = document.getElementById("brandLogo");
        img.onload = function () {
            img.style.display = "block";
            document.getElementById("defaultIcon").style.display = "none";
        };
        img.src = brand.logo;
    }
}

function applyAppearance(appearance) {
    if (!appearance) return;
    // 背景：图片 URL/data URI 优先，其次纯色
    const bg = appearance.background || "";
    if (bg) {
        if (/^(https:\/\/|data:image\/)/.test(bg)) {
            document.body.style.backgroundImage = "linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)),url(\"" + bg.replace(/"/g, "%22") + "\")";
            document.body.style.backgroundSize = "cover";
            document.body.style.backgroundPosition = "center";
        } else {
            document.body.style.background = bg;
        }
    }
    // 页脚文案
    if (appearance.footer_text) {
        const footer = document.getElementById("pageFooter");
        footer.textContent = appearance.footer_text;
        footer.style.display = "block";
    }
}

function createFieldWrapper(field) {
    const wrap = document.createElement("div");
    wrap.className = "field";
    const label = document.createElement("label");
    label.textContent = field.label;
    if (field.required) {
        const req = document.createElement("span");
        req.className = "req";
        req.textContent = "*";
        label.appendChild(req);
    }
    wrap.appendChild(label);
    return wrap;
}

function createControl(field) {
    if (field.type === "textarea") {
        const el = document.createElement("textarea");
        el.rows = 3;
        return el;
    }
    if (field.type === "select") {
        const el = document.createElement("select");
        const empty = document.createElement("option");
        empty.value = "";
        empty.textContent = "请选择";
        el.appendChild(empty);
        (field.options || []).forEach(function (opt) {
            const op = document.createElement("option");
            op.value = opt.value;
            op.textContent = opt.label;
            el.appendChild(op);
        });
        return el;
    }
    const el = document.createElement("input");
    el.type = field.type === "date" ? "date" : "text";
    return el;
}

function renderFields(fields) {
    const box = document.getElementById("dynamicFields");
    box.innerHTML = "";
    extras = [];
    (fields || []).forEach(function (field) {
        if (field.key === "username") {
            const wrap = createFieldWrapper(field);
            const el = document.createElement("input");
            el.type = "text"; el.id = "username"; el.maxLength = 64; el.placeholder = "登录用户名";
            wrap.appendChild(el);
            box.appendChild(wrap);
            return;
        }
        if (field.key === "password") {
            const wrap = createFieldWrapper(field);
            const p1 = document.createElement("input");
            p1.type = "password"; p1.id = "password"; p1.placeholder = "至少6位";
            p1.style.marginBottom = "8px";
            const p2 = document.createElement("input");
            p2.type = "password"; p2.id = "password2"; p2.placeholder = "再次输入密码";
            wrap.appendChild(p1);
            wrap.appendChild(p2);
            box.appendChild(wrap);
            return;
        }
        const wrap = createFieldWrapper(field);
        const el = createControl(field);
        if (field.key === "phone") { el.type = "tel"; el.maxLength = 20; el.placeholder = "请输入手机号"; }
        wrap.appendChild(el);
        box.appendChild(wrap);
        extras.push({ field: field, el: el });
    });
}

function renderAgreement(text) {
    const box = document.getElementById("agreementBox");
    box.innerHTML = "";
    agreementEl = null;
    if (!text) return;
    const wrap = document.createElement("label");
    wrap.className = "agreement";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    const span = document.createElement("span");
    span.textContent = text;
    wrap.appendChild(cb);
    wrap.appendChild(span);
    box.appendChild(wrap);
    agreementEl = cb;
}

fetch(API).then(r => r.json()).then(res => {
    if (res.code !== 0) { showError(res.message || "邀请链接无效"); return; }
    info = res.data;
    applyBrand(info.brand);
    applyAppearance(info.appearance);
    renderMeta();
    renderFields(info.fields || []);
    renderAgreement(info.texts && info.texts.agreement);
    if (info.texts && info.texts.submit) {
        document.getElementById("submitBtn").textContent = info.texts.submit;
    }
    document.getElementById("regForm").style.display = "block";
}).catch(() => showError("网络异常，请稍后重试"));

function submitRegister(e) {
    e.preventDefault();
    clearError();
    const usernameEl = document.getElementById("username");
    const username = usernameEl ? usernameEl.value.trim() : "";
    const password = document.getElementById("password").value;
    const password2 = document.getElementById("password2").value;

    if (!username) return showError("请输入用户名");
    if (password.length < 6) return showError("密码长度不能少于6位");
    if (password !== password2) return showError("两次输入的密码不一致");
    if (agreementEl && !agreementEl.checked) return showError("请先阅读并勾选协议");

    const payload = { username: username, password: password };
    for (let i = 0; i < extras.length; i++) {
        const item = extras[i];
        const value = (item.el.value || "").trim();
        if (!value) {
            if (item.field.required) return showError("请填写" + item.field.label);
            continue;
        }
        payload[item.field.key] = value;
    }

    const btn = document.getElementById("submitBtn");
    const defaultText = btn.textContent;
    btn.disabled = true; btn.textContent = "提交中…";
    fetch(API + "/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    }).then(r => r.json()).then(res => {
        if (res.code !== 0) {
            btn.disabled = false; btn.textContent = defaultText;
            return showError(res.message || "注册失败");
        }
        // 模式二：配置了成功页地址则直接跳回接入方
        if (res.data && res.data.redirect_url) {
            location.href = res.data.redirect_url;
            return;
        }
        const tpl = (info.texts && info.texts.success) || "账号 {username} 已创建，请使用该账号登录系统";
        document.getElementById("formView").style.display = "none";
        document.getElementById("resultView").style.display = "block";
        document.getElementById("resultText").textContent = tpl.replace(/\{username\}/g, res.data.username);
    }).catch(() => {
        btn.disabled = false; btn.textContent = defaultText;
        showError("网络异常，请稍后重试");
    });
    return false;
}
</script>
</body>
</html>
