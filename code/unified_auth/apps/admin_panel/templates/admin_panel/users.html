{% extends "admin_panel/base.html" %}
{% load static %}

{% block title %}用户管理{% endblock %}

{% block head %}
<style>
  .page-card { margin-bottom: 12px; }
  .page-card:last-child { margin-bottom: 0; }
  .import-tip { margin: 0 0 8px; color: var(--el-text-color-secondary); font-size: 12px; }
</style>
{% endblock %}

{% block content %}
<wd-panel shadow="never" class="page-card">
  <wd-search-panel head-refresh-datagrid="true" :default-expand="true" label-width="70px">
    <template #default="{ model }">
      <wd-search-item label="关键词" prop="search">
        <el-input v-model="model.search" placeholder="用户名 / 手机号 / 邮箱" clearable style="width: 200px" ></el-input>
      </wd-search-item>
      <wd-search-item label="状态" prop="status">
        <wd-select v-model="model.status" placeholder="全部" clearable style="width: 120px"
          :data-source="[{ text: '正常', value: 1 }, { text: '禁用', value: 0 }]" ></wd-select>
      </wd-search-item>
      <wd-search-item label="员工" prop="is_staff">
        <wd-select v-model="model.is_staff" placeholder="全部" clearable style="width: 120px"
          :data-source="[{ text: '员工', value: 1 }, { text: '非员工', value: 0 }]" ></wd-select>
      </wd-search-item>
      <wd-search-item label="标签" prop="tag_id">
        <wd-select v-model="model.tag_id" placeholder="全部" clearable style="width: 150px"
          api="/api/v1/admin/tags" text-prop="name" value-prop="id" ></wd-select>
      </wd-search-item>
    </template>
  </wd-search-panel>
</wd-panel>

<wd-panel shadow="never" class="page-card">
  <wd-data-grid ref="gridRef" api="/api/v1/admin/users" api-method="get" active with-selection v-model="selected"
    row-key="id" :tools="{ add: true, refresh: true }"
    @add="openCreate">
    <template #toolbar="{ selection }">
      <el-button size="small" :disabled="!selection.length" @click="onBatchStatus(1)">批量启用</el-button>
      <el-button size="small" :disabled="!selection.length" @click="onBatchStatus(0)">批量禁用</el-button>
      <el-button size="small" :disabled="!selection.length" @click="batchTypeVisible = true">批量类型</el-button>
      <el-button size="small" type="danger" plain :disabled="!selection.length" @click="onBatchDelete">批量删除</el-button>
      <el-button size="small" @click="onExport">导出 CSV</el-button>
      <el-button size="small" @click="openImport">导入</el-button>
    </template>

    <el-table-column prop="username" label="用户名" min-width="120" show-overflow-tooltip ></el-table-column>
    <el-table-column prop="nickname" label="昵称" min-width="100" show-overflow-tooltip>
      <template #default="{ row }">[[ row.nickname || '-' ]]</template>
    </el-table-column>
    <el-table-column prop="user_type" label="类型" width="80" align="center">
      <template #default="{ row }">
        <el-tag :type="row.user_type === 'internal' ? 'primary' : 'success'" size="small">
          [[ row.user_type === 'internal' ? '内部' : '外部' ]]
        </el-tag>
      </template>
    </el-table-column>
    <el-table-column prop="phone" label="手机号" min-width="120">
      <template #default="{ row }">[[ row.phone || '-' ]]</template>
    </el-table-column>
    <el-table-column prop="email" label="邮箱" min-width="160" show-overflow-tooltip>
      <template #default="{ row }">[[ row.email || '-' ]]</template>
    </el-table-column>
    <el-table-column prop="department" label="部门" min-width="110" show-overflow-tooltip>
      <template #default="{ row }">[[ row.department || '-' ]]</template>
    </el-table-column>
    <el-table-column label="角色" min-width="140" show-overflow-tooltip>
      <template #default="{ row }">
        <template v-if="row.role_names && row.role_names.length">
          <el-tag v-for="name in row.role_names" :key="name" size="small" style="margin-right: 4px">[[ name ]]</el-tag>
        </template>
        <span v-else>-</span>
      </template>
    </el-table-column>
    <el-table-column label="状态" width="80" align="center">
      <template #default="{ row }">
        <wd-switch v-model="row.status" :api="'/api/v1/admin/users/' + row.id + '/status'"
          api-method="patch" :active-value="1" :inactive-value="0" ></wd-switch>
      </template>
    </el-table-column>
    <el-table-column label="最后登录" width="150">
      <template #default="{ row }">[[ fmtTime(row.last_login_at) ]]</template>
    </el-table-column>
    <el-table-column label="操作" width="290" align="center" fixed="right">
      <template #default="{ row }">
        <el-button-group>
          <el-button size="small" type="primary" plain @click="onRowAction({ command: 'edit', row: row })">编辑</el-button>
          <el-button size="small" type="primary" plain @click="onRowAction({ command: 'roles', row: row })">角色</el-button>
          <el-button size="small" type="primary" plain @click="onRowAction({ command: 'profile', row: row })">档案</el-button>
          <el-button size="small" type="warning" plain @click="onRowAction({ command: 'reset', row: row })">重置密码</el-button>
          <el-button size="small" type="danger" plain @click="onRowAction({ command: 'delete', row: row })">删除</el-button>
        </el-button-group>
      </template>
    </el-table-column>
  </wd-data-grid>
</wd-panel>

<!-- 新增 / 编辑用户 -->
<el-drawer v-model="drawerVisible" :title="formMode === 'create' ? '新增用户' : '编辑用户'" size="480px" destroy-on-close>
  <wd-data-form v-if="drawerVisible" :mode="formMode"
    :api="formMode === 'edit' ? '/api/v1/admin/users/' + formUserId : ''"
    :submit-api="formMode === 'edit' ? '/api/v1/admin/users/' + formUserId : '/api/v1/admin/users'"
    :submit-method="formMode === 'edit' ? 'put' : 'post'"
    :submit-keys="formMode === 'edit' ? 'nickname,email,phone,department,dept_id,user_type,is_staff' : 'username,password,user_type,nickname,email,phone,department,dept_id,is_staff'"
    :data="{ user_type: 'internal', is_staff: false }"
    :active="true" :rules="formRules" head-refresh-datagrid
    @submit-success="onFormSuccess" @close="drawerVisible = false">
    <template #default="{ model }">
      <template v-if="formMode === 'create'">
        <el-form-item label="用户名" prop="username">
          <el-input v-model="model.username" placeholder="留空自动生成" clearable ></el-input>
        </el-form-item>
        <el-form-item label="初始密码" prop="password">
          <el-input v-model="model.password" type="password" show-password placeholder="留空自动生成" clearable ></el-input>
        </el-form-item>
      </template>
      <el-form-item label="用户类型" prop="user_type">
        <el-radio-group v-model="model.user_type">
          <el-radio value="internal">内部</el-radio>
          <el-radio value="external">外部</el-radio>
        </el-radio-group>
      </el-form-item>
      <el-form-item label="昵称" prop="nickname">
        <el-input v-model="model.nickname" clearable ></el-input>
      </el-form-item>
      <el-form-item label="邮箱" prop="email">
        <el-input v-model="model.email" clearable ></el-input>
      </el-form-item>
      <el-form-item label="手机号" prop="phone">
        <el-input v-model="model.phone" clearable ></el-input>
      </el-form-item>
      <el-form-item label="所属部门" prop="dept_id">
        <wd-select v-model="model.dept_id" placeholder="选择部门" clearable style="width: 100%"
          api="/api/v1/admin/departments" text-prop="name" value-prop="id" ></wd-select>
      </el-form-item>
      <el-form-item label="员工" prop="is_staff">
        <el-switch v-model="model.is_staff" active-text="是" inactive-text="否" ></el-switch>
      </el-form-item>
    </template>
  </wd-data-form>
</el-drawer>

<!-- 角色分配 -->
<el-dialog v-model="roleVisible" :title="'分配角色 - ' + (roleUser ? roleUser.username : '')" width="480px" destroy-on-close>
  <div v-loading="roleLoading">
    <wd-checkbox-list v-model="roleIds"
      api="/api/v1/admin/roles" text-prop="name" value-prop="id" ></wd-checkbox-list>
  </div>
  <template #footer>
    <el-button @click="roleVisible = false">取消</el-button>
    <el-button type="primary" :loading="roleSaving" @click="onRoleSave">保存</el-button>
  </template>
</el-dialog>

<!-- 档案编辑 -->
<el-dialog v-model="profileVisible" title="编辑档案" width="640px" destroy-on-close>
  <wd-data-form v-if="profileVisible" mode="edit"
    :api="'/api/v1/admin/users/' + profileUserId + '/profile'"
    :submit-api="'/api/v1/admin/users/' + profileUserId + '/profile'"
    submit-method="put"
    submit-keys="real_name,gender,birthday,job_title,company,employee_id,work_email,work_phone,wechat,qq,address,bio"
    :active="true" label-width="90px" @close="profileVisible = false">
    <template #default="{ model }">
      <el-row :gutter="12">
        <el-col :span="12">
          <el-form-item label="姓名" prop="real_name"><el-input v-model="model.real_name" clearable ></el-input></el-form-item>
        </el-col>
        <el-col :span="12">
          <el-form-item label="性别" prop="gender">
            <el-radio-group v-model="model.gender">
              <el-radio value="male">男</el-radio>
              <el-radio value="female">女</el-radio>
            </el-radio-group>
          </el-form-item>
        </el-col>
        <el-col :span="12">
          <el-form-item label="生日" prop="birthday">
            <el-date-picker v-model="model.birthday" type="date" value-format="YYYY-MM-DD" style="width: 100%" ></el-date-picker>
          </el-form-item>
        </el-col>
        <el-col :span="12">
          <el-form-item label="职位" prop="job_title"><el-input v-model="model.job_title" clearable ></el-input></el-form-item>
        </el-col>
        <el-col :span="12">
          <el-form-item label="公司" prop="company"><el-input v-model="model.company" clearable ></el-input></el-form-item>
        </el-col>
        <el-col :span="12">
          <el-form-item label="工号" prop="employee_id"><el-input v-model="model.employee_id" clearable ></el-input></el-form-item>
        </el-col>
        <el-col :span="12">
          <el-form-item label="工作邮箱" prop="work_email"><el-input v-model="model.work_email" clearable ></el-input></el-form-item>
        </el-col>
        <el-col :span="12">
          <el-form-item label="工作电话" prop="work_phone"><el-input v-model="model.work_phone" clearable ></el-input></el-form-item>
        </el-col>
        <el-col :span="12">
          <el-form-item label="微信" prop="wechat"><el-input v-model="model.wechat" clearable ></el-input></el-form-item>
        </el-col>
        <el-col :span="12">
          <el-form-item label="QQ" prop="qq"><el-input v-model="model.qq" clearable ></el-input></el-form-item>
        </el-col>
        <el-col :span="24">
          <el-form-item label="地址" prop="address"><el-input v-model="model.address" clearable ></el-input></el-form-item>
        </el-col>
        <el-col :span="24">
          <el-form-item label="简介" prop="bio"><el-input v-model="model.bio" type="textarea" :rows="3" ></el-input></el-form-item>
        </el-col>
      </el-row>
    </template>
  </wd-data-form>
</el-dialog>

<!-- 批量修改类型 -->
<el-dialog v-model="batchTypeVisible" title="批量修改用户类型" width="420px" destroy-on-close>
  <el-radio-group v-model="batchType">
    <el-radio value="internal">内部用户</el-radio>
    <el-radio value="external">外部用户</el-radio>
  </el-radio-group>
  <template #footer>
    <el-button @click="batchTypeVisible = false">取消</el-button>
    <el-button type="primary" :loading="batchSaving" @click="onBatchTypeSave">确定</el-button>
  </template>
</el-dialog>

<!-- 导入用户 -->
<el-dialog v-model="importVisible" title="导入用户" width="560px" destroy-on-close @closed="onImportClosed">
  <p class="import-tip">CSV 表头：用户名,密码,用户类型,昵称,邮箱,手机号,部门（用户类型取 internal / external，密码留空默认 12345678）</p>
  <input ref="importFile" type="file" accept=".csv,text/csv" style="display: none" @change="onImportFile">
  <div style="margin-bottom: 8px">
    <el-button size="small" @click="$refs.importFile.click()">选择 CSV 文件</el-button>
    <el-button size="small" text type="primary" @click="fillImportSample">填入示例</el-button>
  </div>
  <el-input v-model="importContent" type="textarea" :rows="8" placeholder="粘贴 CSV 内容，或点击上方按钮选择文件" ></el-input>
  <template v-if="importResult">
    <el-alert :type="importResult.errors && importResult.errors.length ? 'warning' : 'success'"
      :closable="false" style="margin-top: 8px"
      :title="'成功导入 ' + importResult.created + ' 条，失败 ' + (importResult.errors ? importResult.errors.length : 0) + ' 条'" ></el-alert>
    <el-table v-if="importResult.errors && importResult.errors.length" :data="importResult.errors"
      size="small" border style="margin-top: 8px" max-height="200">
      <el-table-column prop="row" label="行号" width="80" ></el-table-column>
      <el-table-column prop="message" label="错误原因" ></el-table-column>
    </el-table>
  </template>
  <template #footer>
    <el-button @click="importVisible = false">关闭</el-button>
    <el-button type="primary" :loading="importSaving" :disabled="!importContent.trim()" @click="onImportSubmit">开始导入</el-button>
  </template>
</el-dialog>
{% endblock %}

{% block script %}
<script>
AdminUI.start('/admin-panel/users/', {
  data: function () {
    return {
      selected: [],
      drawerVisible: false,
      formMode: 'create',
      formUserId: null,
      formRules: {
        user_type: [{ required: true, message: '请选择用户类型', trigger: 'change' }],
        password: [{ min: 8, message: '密码至少 8 位', trigger: 'blur' }],
        email: [{ type: 'email', message: '邮箱格式不正确', trigger: 'blur' }],
        phone: [{ pattern: /^1\d{10}$/, message: '手机号格式不正确', trigger: 'blur' }]
      },
      roleVisible: false,
      roleUser: null,
      roleIds: [],
      roleLoading: false,
      roleSaving: false,
      profileVisible: false,
      profileUserId: null,
      batchTypeVisible: false,
      batchType: 'internal',
      batchSaving: false,
      importVisible: false,
      importContent: '',
      importResult: null,
      importSaving: false
    };
  },
  methods: {
    fmtTime: AdminUI.fmtTime,

    /* ---------- 新增 / 编辑 ---------- */
    openCreate: function () {
      this.formMode = 'create';
      this.formUserId = null;
      this.drawerVisible = true;
    },
    onRowAction: function (evt) {
      var row = evt.row;
      if (evt.command === 'edit') {
        this.formMode = 'edit';
        this.formUserId = row.id;
        this.drawerVisible = true;
      } else if (evt.command === 'roles') {
        this.openRoles(row);
      } else if (evt.command === 'profile') {
        this.profileUserId = row.id;
        this.profileVisible = true;
      } else if (evt.command === 'reset') {
        this.onResetPassword(row);
      } else if (evt.command === 'delete') {
        this.onDelete(row);
      }
    },
    onFormSuccess: function (data) {
      if (data && data._generated_username) {
        ElementPlus.ElMessageBox.alert(
          '用户名：' + data._generated_username + '\n初始密码：' + data._generated_password,
          '用户创建成功，请保存初始凭证',
          { confirmButtonText: '已保存', customStyle: { whiteSpace: 'pre-line' } }
        );
      }
    },

    /* ---------- 角色分配 ---------- */
    openRoles: function (row) {
      this.roleUser = row;
      this.roleIds = [];
      this.roleVisible = true;
      this.roleLoading = true;
      var self = this;
      WorkDesktop.request.get('/api/v1/admin/users/' + row.id + '/roles').then(function (res) {
        if (res && res.success) self.roleIds = res.data.role_ids || [];
        else AdminUI.toastFail(res, '加载角色失败');
      }).finally(function () {
        self.roleLoading = false;
      });
    },
    onRoleSave: function () {
      var self = this;
      this.roleSaving = true;
      WorkDesktop.request.put('/api/v1/admin/users/' + this.roleUser.id + '/roles', {
        role_ids: this.roleIds
      }).then(function (res) {
        if (res && res.success) {
          ElementPlus.ElMessage.success('角色已更新');
          self.roleVisible = false;
          self.$refs.gridRef.refresh();
        } else {
          AdminUI.toastFail(res, '保存失败');
        }
      }).finally(function () {
        self.roleSaving = false;
      });
    },

    /* ---------- 重置密码 / 删除 ---------- */
    onResetPassword: function (row) {
      ElementPlus.ElMessageBox.prompt('请输入新密码（至少 8 位）', '重置密码 - ' + row.username, {
        inputType: 'password',
        inputPattern: /^.{8,}$/,
        inputErrorMessage: '密码至少 8 位',
        confirmButtonText: '确定',
        cancelButtonText: '取消'
      }).then(function (ret) {
        return WorkDesktop.request.post('/api/v1/admin/users/' + row.id + '/reset-password', {
          new_password: ret.value
        });
      }).then(function (res) {
        if (res && res.success) ElementPlus.ElMessage.success('密码已重置');
        else AdminUI.toastFail(res, '重置失败');
      }).catch(function () {});
    },
    onDelete: function (row) {
      var self = this;
      ElementPlus.ElMessageBox.confirm('确定删除用户「' + row.username + '」吗？此操作不可恢复。', '删除用户', {
        type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消'
      }).then(function () {
        return WorkDesktop.request.delete('/api/v1/admin/users/' + row.id);
      }).then(function (res) {
        if (res && res.success) {
          ElementPlus.ElMessage.success('已删除');
          self.$refs.gridRef.refresh();
        } else {
          AdminUI.toastFail(res, '删除失败');
        }
      }).catch(function () {});
    },

    /* ---------- 批量操作 ---------- */
    selectedIds: function () {
      return this.selected.map(function (u) { return u.id; });
    },
    onBatchStatus: function (status) {
      var self = this;
      var text = status === 1 ? '启用' : '禁用';
      ElementPlus.ElMessageBox.confirm('确定' + text + '选中的 ' + this.selected.length + ' 个用户吗？', '批量' + text, {
        type: 'warning', confirmButtonText: '确定', cancelButtonText: '取消'
      }).then(function () {
        return WorkDesktop.request.post('/api/v1/admin/users/batch-status', {
          user_ids: self.selectedIds(), status: status
        });
      }).then(function (res) {
        if (res && res.success) {
          ElementPlus.ElMessage.success('已' + text + ' ' + res.data.updated_count + ' 个用户');
          self.$refs.gridRef.clearSelection();
          self.$refs.gridRef.refresh();
        } else {
          AdminUI.toastFail(res, '操作失败');
        }
      }).catch(function () {});
    },
    onBatchTypeSave: function () {
      var self = this;
      this.batchSaving = true;
      WorkDesktop.request.post('/api/v1/admin/users/batch-user-type', {
        user_ids: this.selectedIds(), user_type: this.batchType
      }).then(function (res) {
        if (res && res.success) {
          ElementPlus.ElMessage.success('已更新 ' + res.data.updated_count + ' 个用户');
          self.batchTypeVisible = false;
          self.$refs.gridRef.clearSelection();
          self.$refs.gridRef.refresh();
        } else {
          AdminUI.toastFail(res, '操作失败');
        }
      }).finally(function () {
        self.batchSaving = false;
      });
    },
    onBatchDelete: function () {
      var self = this;
      ElementPlus.ElMessageBox.confirm('确定删除选中的 ' + this.selected.length + ' 个用户吗？此操作不可恢复。', '批量删除', {
        type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消'
      }).then(function () {
        return WorkDesktop.request.post('/api/v1/admin/users/batch-delete', {
          user_ids: self.selectedIds()
        });
      }).then(function (res) {
        if (res && res.success) {
          ElementPlus.ElMessage.success('已删除 ' + res.data.deleted_count + ' 个用户');
          self.$refs.gridRef.clearSelection();
          self.$refs.gridRef.refresh();
        } else {
          AdminUI.toastFail(res, '删除失败');
        }
      }).catch(function () {});
    },

    /* ---------- 导入 / 导出 ---------- */
    onExport: function () {
      AdminUI.downloadCsv('/api/v1/admin/users/export', {}, 'users.csv');
    },
    openImport: function () {
      this.importVisible = true;
    },
    onImportClosed: function () {
      this.importContent = '';
      this.importResult = null;
      this.importSaving = false;
    },
    onImportFile: function (evt) {
      var file = evt.target.files && evt.target.files[0];
      if (!file) return;
      var self = this;
      var reader = new FileReader();
      reader.onload = function () {
        self.importContent = String(reader.result || '');
      };
      reader.readAsText(file, 'utf-8');
      evt.target.value = '';
    },
    fillImportSample: function () {
      this.importContent = '用户名,密码,用户类型,昵称,邮箱,手机号,部门\nexample_user,pass12345,internal,示例用户,example@test.com,13800000000,技术部';
    },
    onImportSubmit: function () {
      var self = this;
      this.importSaving = true;
      this.importResult = null;
      WorkDesktop.request.post('/api/v1/admin/users/import', {
        csv_content: this.importContent
      }).then(function (res) {
        if (res && res.success) {
          self.importResult = res.data;
          if (res.data.created > 0) self.$refs.gridRef.refresh();
        } else {
          AdminUI.toastFail(res, '导入失败');
        }
      }).finally(function () {
        self.importSaving = false;
      });
    }
  }
});
</script>
{% endblock %}
