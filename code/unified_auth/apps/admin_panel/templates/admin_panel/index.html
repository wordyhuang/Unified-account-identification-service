<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统一账号识别管理平台</title>
    <link rel="icon" type="image/svg+xml" href="/static/admin_panel/favicon.svg">
    <link rel="stylesheet" href="/static/admin_panel/css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
    <div id="app-login" class="login-page" style="display:none">
        <div class="login-card">
            <div class="login-logo">
                <img src="/static/admin_panel/favicon.svg" alt="统一账号识别管理平台" width="48" height="48">
                <h1>统一账号识别管理平台</h1>
            </div>
            <form id="login-form" onsubmit="return false">
                <div class="form-group">
                    <label for="login-username">用户名</label>
                    <input type="text" id="login-username" placeholder="请输入用户名" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-password">密码</label>
                    <input type="password" id="login-password" placeholder="请输入密码" required autocomplete="current-password">
                </div>
                <div id="login-error" class="form-error"></div>
                <button type="submit" class="btn btn-primary btn-block" onclick="handleLogin()">登 录</button>
            </form>
        </div>
    </div>

    <div id="app-main" style="display:none">
        <header class="topbar">
            <div class="topbar-left">
                <svg width="32" height="32" viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="10" fill="#1a73e8"/><path d="M14 28h20v4H14zm0-8h20v4H14zm0-8h20v4H14z" fill="#fff"/></svg>
                <span class="topbar-title">统一账号识别管理平台</span>
            </div>
            <div class="topbar-right">
                <span class="topbar-user" id="topbar-user"></span>
                <button class="btn btn-text" onclick="handleLogout()">退出</button>
            </div>
        </header>
        <div id="impersonate-banner" class="impersonate-banner" style="display:none">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span>模拟模式：正在以超级管理员身份操作租户 <strong id="impersonate-tenant-name"></strong></span>
            <button class="btn btn-sm" style="background:rgba(255,255,255,0.2);color:#fff;border:none;padding:4px 12px;border-radius:4px;cursor:pointer" onclick="exitImpersonation()">退出模拟</button>
        </div>
        <div class="app-body">
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <div class="nav-section-label" data-superadmin style="display:none">平台管理</div>
                    <a class="nav-item" data-page="superadmin_dashboard" data-superadmin style="display:none" onclick="switchPage('superadmin_dashboard')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                        平台总览
                    </a>
                    <a class="nav-item" data-page="superadmin_tenants" data-superadmin style="display:none" onclick="switchPage('superadmin_tenants')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
                        租户管理
                    </a>
                    <a class="nav-item" data-page="superadmin_audit" data-superadmin style="display:none" onclick="switchPage('superadmin_audit')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15l2 2 4-4"/></svg>
                        全局审计
                    </a>
                    <a class="nav-item" data-page="superadmin_report" data-superadmin style="display:none" onclick="switchPage('superadmin_report')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2"/><path d="M3 12h18"/><path d="M12 3v18"/><path d="M3 12a9 9 0 0 0 9 9 9 9 0 0 0 9-9"/></svg>
                        统计报表
                    </a>
                    <a class="nav-item" data-page="superadmin_apistats" data-superadmin style="display:none" onclick="switchPage('superadmin_apistats')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
                        API统计
                    </a>
                    <a class="nav-item" data-page="superadmin_config" data-superadmin style="display:none" onclick="switchPage('superadmin_config')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                        全局配置
                    </a>
                    <div class="nav-section-label" data-admin>租户管理</div>
                    <a class="nav-item active" data-page="dashboard" data-admin onclick="switchPage('dashboard')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                        仪表盘
                    </a>
                    <a class="nav-item" data-page="users" data-admin onclick="switchPage('users')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        用户管理
                    </a>
                    <a class="nav-item" data-page="applications" data-admin onclick="switchPage('applications')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8"/><rect x="2" y="14" width="8" height="8"/><rect x="14" y="14" width="8" height="8"/></svg>
                        应用管理
                    </a>
                    <a class="nav-item" data-page="roles" data-admin onclick="switchPage('roles')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        角色权限
                    </a>
                    <a class="nav-item" data-page="departments" data-admin onclick="switchPage('departments')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                        部门管理
                    </a>
                    <a class="nav-item" data-page="audit" data-admin onclick="switchPage('audit')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                        审计日志
                    </a>
                    <a class="nav-item" data-page="sms_config" data-admin onclick="switchPage('sms_config')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        短信配置
                    </a>
                </nav>
            </aside>
            <main class="content" id="page-content"></main>
        </div>
    </div>

    <div id="modal-overlay" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
        <div class="modal" id="modal-container"></div>
    </div>

    <script src="/static/admin_panel/js/admin.js"></script>
</body>
</html>
