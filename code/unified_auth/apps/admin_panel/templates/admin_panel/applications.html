{% extends "admin_panel/base.html" %}
{% load static %}

{% block title %}应用管理{% endblock %}

{% block head %}
<style>
  .page-card { margin-bottom: 12px; }
  .page-card:last-child { margin-bottom: 0; }
  .url-row { display: flex; margin-bottom: 6px; }
  .url-row .el-input { flex: 1; }
  .url-row .el-button { margin-left: 6px; }
  .secret-value { font-family: monospace; word-break: break-all; background: var(--el-fill-color-light); padding: 8px 10px; border-radius: 4px; }
  .stats-chart { width: 100%; height: auto; display: block; }
</style>
{% endblock %}

{% block content %}
<wd-panel shadow="never" class="page-card">
  <wd-search-panel head-refresh-datagrid="true" :default-expand="true" label-width="70px">
    <template #default="{ model }">
      <wd-search-item label="应用名称" prop="search">
        <el-input v-model="model.search" placeholder="按名称搜索" clearable style="width: 200px" ></el-input>
      </wd-search-item>
      <wd-search-item label="状态" prop="status">
        <wd-select v-model="model.status" placeholder="全部" clearable style="width: 120px"
          :data-source="[{ text: '正常', value: 'true' }, { text: '停用', value: 'false' }]" ></wd-select>
      </wd-search-item>
    </template>
  </wd-search-panel>
</wd-panel>

<wd-panel shadow="never" class="page-card">
  <wd-data-grid ref="gridRef" api="/api/v1/admin/applications" api-method="get" active row-key="id"
    :tools="{ add: true, refresh: true }"
    @add="openCreate">
    <el-table-column prop="name" label="应用名称" min-width="140" show-overflow-tooltip ></el-table-column>
    <el-table-column prop="app_key" label="App Key" min-width="200" show-overflow-tooltip>
      <template #default="{ row }"><span style="font-family: monospace">[[ row.app_key ]]</span></template>
    </el-table-column>
    <el-table-column label="默认用户类型" min-width="130">
      <template #default="{ row }">
        <template v-if="row.default_access_user_types && row.default_access_user_types.length">
          <el-tag v-for="t in row.default_access_user_types" :key="t" size="small"
            :type="t === 'internal' ? 'primary' : 'success'" style="margin-right: 4px">
            [[ t === 'internal' ? '内部' : '外部' ]]
          </el-tag>
        </template>
        <span v-else>-</span>
      </template>
    </el-table-column>
    <el-table-column label="角色" min-width="140" show-overflow-tooltip>
      <template #default="{ row }">
        <template v-if="row.roles && row.roles.length">
          <el-tag v-for="r in row.roles" :key="r.id" size="small" style="margin-right: 4px">[[ r.name ]]</el-tag>
        </template>
        <span v-else>-</span>
      </template>
    </el-table-column>
    <el-table-column label="状态" width="80" align="center">
      <template #default="{ row }">
        <wd-switch v-model="row.status" :api="'/api/v1/admin/applications/' + row.id + '/status'"
          api-method="patch" :active-value="true" :inactive-value="false" ></wd-switch>
      </template>
    </el-table-column>
    <el-table-column label="创建时间" width="150">
      <template #default="{ row }">[[ fmtTime(row.created_at) ]]</template>
    </el-table-column>
    <el-table-column label="操作" width="220" align="center" fixed="right">
      <template #default="{ row }">
        <el-button-group>
          <el-button size="small" type="primary" plain @click="onRowAction({ command: 'edit', row: row })">编辑</el-button>
          <el-button size="small" type="primary" plain @click="onRowAction({ command: 'secret', row: row })">密钥</el-button>
          <el-button size="small" type="primary" plain @click="onRowAction({ command: 'perms', row: row })">权限</el-button>
          <el-button size="small" type="primary" plain @click="onRowAction({ command: 'stats', row: row })">统计</el-button>
        </el-button-group>
      </template>
    </el-table-column>
  </wd-data-grid>
</wd-panel>

<!-- 新增 / 编辑应用 -->
<el-drawer v-model="drawerVisible" :title="formMode === 'create' ? '新增应用' : '编辑应用'" size="520px" destroy-on-close>
  <wd-data-form v-if="drawerVisible" :mode="formMode"
    :api="formMode === 'edit' ? '/api/v1/admin/applications/' + formAppId : ''"
    :submit-api="formMode === 'edit' ? '/api/v1/admin/applications/' + formAppId : '/api/v1/admin/applications'"
    :submit-method="formMode === 'edit' ? 'put' : 'post'"
    :submit-keys="formMode === 'edit' ? 'name,callback_urls,default_access_user_types,role_ids,wechat_mp_app_id,wechat_mp_app_secret,wechat_web_app_id,wechat_web_app_secret' : 'name,callback_urls,default_access_user_types'"
    :data="{ callback_urls: [], default_access_user_types: [] }"
    :active="true" :rules="formRules" head-refresh-datagrid
    @submit-success="onFormSuccess" @close="drawerVisible = false">
    <template #default="{ model }">
      <el-form-item label="应用名称" prop="name">
        <el-input v-model="model.name" clearable ></el-input>
      </el-form-item>
      <el-form-item label="回调地址" prop="callback_urls">
        <div style="width: 100%">
          <div v-for="(url, idx) in model.callback_urls" :key="idx" class="url-row">
            <el-input v-model="model.callback_urls[idx]" placeholder="https://example.com/callback" clearable ></el-input>
            <el-button size="small" type="danger" plain @click="model.callback_urls.splice(idx, 1)">删除</el-button>
          </div>
          <el-button size="small" @click="model.callback_urls.push('')">添加地址</el-button>
        </div>
      </el-form-item>
      <el-form-item label="默认用户类型" prop="default_access_user_types">
        <el-checkbox-group v-model="model.default_access_user_types">
          <el-checkbox value="internal">内部用户</el-checkbox>
          <el-checkbox value="external">外部用户</el-checkbox>
        </el-checkbox-group>
      </el-form-item>
      <template v-if="formMode === 'edit'">
        <el-form-item label="绑定角色" prop="role_ids">
          <wd-checkbox-list v-model="model.role_ids"
            api="/api/v1/admin/roles" text-prop="name" value-prop="id" ></wd-checkbox-list>
        </el-form-item>
        <el-divider content-position="left">微信公众号（选填）</el-divider>
        <el-form-item label="AppID" prop="wechat_mp_app_id">
          <el-input v-model="model.wechat_mp_app_id" clearable ></el-input>
        </el-form-item>
        <el-form-item label="AppSecret" prop="wechat_mp_app_secret">
          <el-input v-model="model.wechat_mp_app_secret" placeholder="*** 表示保持不变，清空则不设置" clearable ></el-input>
        </el-form-item>
        <el-divider content-position="left">微信开放平台（选填）</el-divider>
        <el-form-item label="AppID" prop="wechat_web_app_id">
          <el-input v-model="model.wechat_web_app_id" clearable ></el-input>
        </el-form-item>
        <el-form-item label="AppSecret" prop="wechat_web_app_secret">
          <el-input v-model="model.wechat_web_app_secret" placeholder="*** 表示保持不变，清空则不设置" clearable ></el-input>
        </el-form-item>
      </template>
    </template>
  </wd-data-form>
</el-drawer>

<!-- 应用密钥 -->
<el-dialog v-model="secretVisible" :title="'应用密钥 - ' + (secretApp ? secretApp.name : '')" width="520px" destroy-on-close>
  <div v-loading="secretLoading">
    <template v-if="secretInfo">
      <el-alert type="warning" :closable="false" title="App Secret 为敏感凭证，请妥善保管，不要泄露给无关人员" style="margin-bottom: 12px" ></el-alert>
      <el-descriptions :column="1" border>
        <el-descriptions-item label="App Key">
          <span class="secret-value">[[ secretApp ? secretApp.app_key : '' ]]</span>
        </el-descriptions-item>
        <el-descriptions-item label="App Secret">
          <span class="secret-value">[[ secretInfo.app_secret ]]</span>
        </el-descriptions-item>
      </el-descriptions>
      <div style="margin-top: 12px">
        <el-button size="small" @click="onCopySecret">复制 Secret</el-button>
        <el-button size="small" type="danger" plain :loading="secretRegenerating" @click="onRegenerateSecret">重新生成</el-button>
      </div>
    </template>
  </div>
  <template #footer>
    <el-button @click="secretVisible = false">关闭</el-button>
  </template>
</el-dialog>

<!-- 角色权限（只读聚合） -->
<el-dialog v-model="permVisible" :title="'角色权限 - ' + (permApp ? permApp.name : '')" width="720px" destroy-on-close>
  <div v-loading="permLoading">
    <el-alert type="info" :closable="false" title="以下为该应用绑定角色所拥有的全部接口权限（只读，权限调整请在角色管理中操作）" style="margin-bottom: 12px" ></el-alert>
    <el-table :data="permList" size="small" border max-height="420">
      <el-table-column prop="name" label="权限名称" min-width="130" show-overflow-tooltip ></el-table-column>
      <el-table-column prop="code" label="编码" min-width="160" show-overflow-tooltip ></el-table-column>
      <el-table-column prop="method" label="方法" width="70" align="center" ></el-table-column>
      <el-table-column prop="path" label="路径" min-width="200" show-overflow-tooltip ></el-table-column>
      <el-table-column prop="category" label="分类" width="100" show-overflow-tooltip ></el-table-column>
    </el-table>
  </div>
  <template #footer>
    <el-button @click="permVisible = false">关闭</el-button>
  </template>
</el-dialog>

<!-- API 调用统计 -->
<el-dialog v-model="statsVisible" :title="'API 调用统计 - ' + (statsApp ? statsApp.name : '')" width="720px" destroy-on-close>
  <div v-loading="statsLoading">
    <div style="margin-bottom: 12px">
      <el-radio-group v-model="statsDays" @change="loadApiStats">
        <el-radio-button :value="7">近 7 天</el-radio-button>
        <el-radio-button :value="14">近 14 天</el-radio-button>
        <el-radio-button :value="30">近 30 天</el-radio-button>
      </el-radio-group>
    </div>
    <wd-panel shadow="never" style="margin-bottom: 12px" title="每日调用量">
      <svg v-if="statsData && statsData.daily_totals && statsData.daily_totals.length" class="stats-chart" viewBox="0 0 560 160">
        <polyline :points="statsPoints" fill="none" stroke="var(--el-color-primary)" stroke-width="2" />
        <text v-for="(p, i) in statsLabels" :key="i" :x="p.x" y="155" font-size="9" text-anchor="middle" fill="var(--el-text-color-secondary)">[[ p.text ]]</text>
      </svg>
      <el-empty v-else description="暂无调用数据" :image-size="60" ></el-empty>
    </wd-panel>
    <wd-panel shadow="never" title="接口调用排行">
      <el-table :data="statsData ? statsData.path_totals : []" size="small" border max-height="260">
        <el-table-column prop="api_path" label="接口路径" min-width="220" show-overflow-tooltip ></el-table-column>
        <el-table-column prop="count" label="调用次数" width="110" align="right" ></el-table-column>
      </el-table>
    </wd-panel>
  </div>
  <template #footer>
    <el-button @click="statsVisible = false">关闭</el-button>
  </template>
</el-dialog>
{% endblock %}

{% block script %}
<script>
AdminUI.start('/admin-panel/applications/', {
  data: function () {
    return {
      drawerVisible: false,
      formMode: 'create',
      formAppId: null,
      formRules: {
        name: [{ required: true, message: '请输入应用名称', trigger: 'blur' }],
        callback_urls: [{
          validator: function (rule, value, cb) {
            if (value && value.some(function (u) { return !u || !u.trim(); })) {
              cb(new Error('存在空的回调地址，请填写完整或删除该行'));
            } else {
              cb();
            }
          }, trigger: 'blur'
        }]
      },
      secretVisible: false,
      secretApp: null,
      secretInfo: null,
      secretLoading: false,
      secretRegenerating: false,
      permVisible: false,
      permApp: null,
      permList: [],
      permLoading: false,
      statsVisible: false,
      statsApp: null,
      statsData: null,
      statsDays: 7,
      statsLoading: false
    };
  },
  computed: {
    statsPoints: function () {
      if (!this.statsData || !this.statsData.daily_totals || !this.statsData.daily_totals.length) return '';
      var list = this.statsData.daily_totals;
      var max = Math.max.apply(null, list.map(function (d) { return d.count; }).concat([1]));
      var w = 560, h = 140, pad = 6;
      var step = list.length > 1 ? (w - pad * 2) / (list.length - 1) : 0;
      return list.map(function (d, i) {
        var x = pad + step * i;
        var y = h - 20 - (d.count / max) * (h - 30);
        return x.toFixed(1) + ',' + y.toFixed(1);
      }).join(' ');
    },
    statsLabels: function () {
      if (!this.statsData || !this.statsData.daily_totals) return [];
      var list = this.statsData.daily_totals;
      var pad = 6, w = 560;
      var step = list.length > 1 ? (w - pad * 2) / (list.length - 1) : 0;
      var every = Math.ceil(list.length / 8);
      return list.filter(function (d, i) { return i % every === 0; }).map(function (d) {
        var i = list.indexOf(d);
        return { x: (pad + step * i).toFixed(1), text: (d.date || '').slice(5) };
      });
    }
  },
  methods: {
    fmtTime: AdminUI.fmtTime,

    /* ---------- 新增 / 编辑 ---------- */
    openCreate: function () {
      this.formMode = 'create';
      this.formAppId = null;
      this.drawerVisible = true;
    },
    onRowAction: function (evt) {
      var row = evt.row;
      if (evt.command === 'edit') {
        this.formMode = 'edit';
        this.formAppId = row.id;
        this.drawerVisible = true;
      } else if (evt.command === 'secret') {
        this.openSecret(row);
      } else if (evt.command === 'perms') {
        this.openPerms(row);
      } else if (evt.command === 'stats') {
        this.openStats(row);
      }
    },
    onFormSuccess: function (data) {
      if (this.formMode === 'create' && data && data.app_secret) {
        ElementPlus.ElMessageBox.alert(
          'App Key：' + data.app_key + '\nApp Secret：' + data.app_secret,
          '应用创建成功，App Secret 仅本次展示，请立即保存',
          { confirmButtonText: '已保存', customStyle: { whiteSpace: 'pre-line' } }
        );
      }
    },

    /* ---------- 密钥 ---------- */
    openSecret: function (row) {
      this.secretApp = row;
      this.secretInfo = null;
      this.secretVisible = true;
      this.secretLoading = true;
      var self = this;
      WorkDesktop.request.get('/api/v1/admin/applications/' + row.id + '/secret').then(function (res) {
        if (res && res.success) self.secretInfo = res.data;
        else AdminUI.toastFail(res, '获取密钥失败');
      }).finally(function () {
        self.secretLoading = false;
      });
    },
    onCopySecret: function () {
      if (!this.secretInfo) return;
      var text = this.secretInfo.app_secret;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          ElementPlus.ElMessage.success('已复制');
        });
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        ElementPlus.ElMessage.success('已复制');
      }
    },
    onRegenerateSecret: function () {
      var self = this;
      ElementPlus.ElMessageBox.confirm('重新生成后旧 Secret 将立即失效，确定继续吗？', '重新生成 Secret', {
        type: 'warning', confirmButtonText: '重新生成', cancelButtonText: '取消'
      }).then(function () {
        self.secretRegenerating = true;
        return WorkDesktop.request.post('/api/v1/admin/applications/' + self.secretApp.id + '/regenerate-secret');
      }).then(function (res) {
        if (res && res.success) {
          self.secretInfo = res.data;
          ElementPlus.ElMessage.success('已重新生成，请保存新 Secret');
        } else if (res) {
          AdminUI.toastFail(res, '操作失败');
        }
      }).catch(function () {}).finally(function () {
        self.secretRegenerating = false;
      });
    },

    /* ---------- 角色权限 ---------- */
    openPerms: function (row) {
      this.permApp = row;
      this.permList = [];
      this.permVisible = true;
      this.permLoading = true;
      var self = this;
      WorkDesktop.request.get('/api/v1/admin/applications/' + row.id + '/permissions').then(function (res) {
        if (res && res.success) self.permList = res.data.permissions || [];
        else AdminUI.toastFail(res, '加载权限失败');
      }).finally(function () {
        self.permLoading = false;
      });
    },

    /* ---------- API 统计 ---------- */
    openStats: function (row) {
      this.statsApp = row;
      this.statsData = null;
      this.statsDays = 7;
      this.statsVisible = true;
      this.loadApiStats();
    },
    loadApiStats: function () {
      var self = this;
      this.statsLoading = true;
      WorkDesktop.request.get('/api/v1/admin/applications/' + this.statsApp.id + '/api-stats', { days: this.statsDays }).then(function (res) {
        if (res && res.success) self.statsData = res.data;
        else AdminUI.toastFail(res, '加载统计失败');
      }).finally(function () {
        self.statsLoading = false;
      });
    }
  }
});
</script>
{% endblock %}
