<!DOCTYPE html>
<html>
<head><title>授权确认</title></head>
<body style="font-family: sans-serif; max-width: 500px; margin: 80px auto;">
  <h2>授权确认</h2>
  <p>应用 <strong>{{ app.name }}</strong> 请求以下授权：</p>
  <ul>
    <li>获取你的用户信息（用户名、头像）</li>
    <li>验证你的登录状态</li>
  </ul>
  <form action="{% url 'oauth_authorize_confirm' %}" method="post" style="display:inline">
    {% csrf_token %}
    <button type="submit" style="padding:10px 30px;background:#28a745;color:white;border:none">确认授权</button>
  </form>
  <a href="{% url 'oauth_authorize_deny' %}" style="margin-left:10px;padding:10px 30px;background:#dc3545;color:white;text-decoration:none">拒绝</a>
  <p style="margin-top:30px;font-size:12px;color:#666;">登录用户: {{ user.username }}</p>
</body>
</html>
